
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./css/stylesheet.css">

    <title>Mewgenics - Gatos e Caos</title>
</head>

<body>

    <div class="titulo">
        <h1>MEWGENICS</h1>
        <h5>um ótimo jogo de estratégia para passar raiva</h5>

        <img
            src="https://i.pinimg.com/736x/be/d2/2a/bed22af3c394516077a0b5e89176aac3.jpg"
            alt="Imagem de gato para o site"
        >
    </div>

    <hr>

    <div class="container">

        <h2>Cadastro de um humano suspeito</h2>
        <p>Entre para o mundo dos gatos. Miau.</p>

        <form>

            <div class="from-control">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="Seu nome">
            </div>

            <div class="from-control">
                <label for="email">Gmail:</label>
                <input type="email" id="email" name="email" placeholder="seuemail@gmail.com">
            </div>

            <div class="from-control">
                <label for="numero">Número:</label>
                <input type="tel" id="numero" name="numero" placeholder="Seu telefone">
            </div>

            <div class="from-control">
                <label for="data">Data de nascimento:</label>
                <input type="date" id="data" name="data">
            </div>

            <div class="from-control">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" placeholder="Crie uma senha">
            </div>

            <div class="from-control">
                <label for="preferencia">O que você mais gosta?</label>

                <select id="preferencia" name="preferencia">
                    <option value="">Escolha uma opção</option>
                    <option value="gatos">Os gatos</option>
                    <option value="batalhas">As batalhas</option>
                    <option value="estrategia">A estratégia</option>
                    <option value="reproducao">A criação de gatos</option>
                    <option value="caos">O caos absoluto</option>
                    <option value="raiva">Passar raiva</option>
                </select>
            </div>

            <div class="botoes">
                <button type="submit" class="btn-cadastro">
                    Submit
                </button>

                <button type="reset" class="btn-limpar">
                    Limpar
                </button>
            </div>

        </form>

    </div>

    <footer>
        <p>MEWGENICS — muitos gatos, pouca sanidade.</p>
    </footer>

</body>
</html>
